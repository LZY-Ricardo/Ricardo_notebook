repo: LZY-Ricardo/Ricardo_notebook
baseBranch: main
baseLanguage: zh-CN
targetLanguages:
  - zh-TW
include:
  - README.md
  - client/README.md
  - server/readme.md
ignoreFile: .github-global-ignore
outputRoot: translations
model:
  provider: openrouter
  id: openrouter/auto
readmeNavigation:
  enabled: true
pullRequest:
  branch: gittrans/main
  titleTemplate: "docs: update translations"
